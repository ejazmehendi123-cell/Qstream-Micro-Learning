version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: qstream-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost
      - SUPABASE_URL=${SUPABASE_URL:-https://hataawyodibdnnjolvqc.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - qstream-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: qstream-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - qstream-network

  redis:
    image: redis:7-alpine
    container_name: qstream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - qstream-network

networks:
  qstream-network:
    driver: bridge

volumes:
  redis-data:
