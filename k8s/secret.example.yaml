type: Opaque
stringData:
  SUPABASE_ANON_KEY: "your-base64-or-plain-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-base64-or-plain-service-role-key"
  OPENAI_API_KEY: "your-openai-api-key"
  JWT_SECRET: "your-jwt-signing-secret"
