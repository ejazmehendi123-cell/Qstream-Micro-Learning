apiVersion: apps/v1
kind: Deployment
metadata:
  name: qstream-client
  namespace: qstream-ai
  labels:
    app: qstream-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qstream-client
  template:
    metadata:
      labels:
        app: qstream-client
    spec:
      containers:
        - name: client
          image: qstream-ai/client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: qstream-client-service
  namespace: qstream-ai
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: qstream-client
